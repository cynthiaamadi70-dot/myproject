<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Student Management System</h1>
        <p>Manage, register and organize student records easily.</p>
    </header>

    <div class="stats">

        <div class="stat-card">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat-card">
            <p>Departments</p>
            <h2 id="totalDepartments">0</h2>
        </div>

        <div class="stat-card">
            <p>Registered Records</p>
            <h2 id="totalRecords">0</h2>
        </div>

    </div>

    <div class="section">

        <h2 id="formTitle">Register New Student</h2>

        <form id="studentForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label>Matric Number</label>
                <input type="text" id="matric" placeholder="Enter matric number" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option>Software Engineering</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Business Administration</option>
                    <option>Accounting</option>
                    <option>Mass Communication</option>
                </select>
            </div>

            <div class="form-group">
                <label>Level</label>
                <select id="level" required>
                    <option value="">Select Level</option>
                    <option>100 Level</option>
                    <option>200 Level</option>
                    <option>300 Level</option>
                    <option>400 Level</option>
                    <option>500 Level</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Register Student
            </button>

        </form>

    </div>

    <div class="section">

        <h2>Registered Students</h2>

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search by name, matric number, department or email..."
            >
        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>S/N</th>
                        <th>Full Name</th>
                        <th>Matric Number</th>
                        <th>Department</th>
                        <th>Level</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
